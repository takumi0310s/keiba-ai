name: Paddock comparison checks
on:
  pull_request:
    paths: ['extensions/paddock_lab/**', '.github/workflows/paddock-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
        working-directory: extensions/paddock_lab
      - run: python examples/run_demo.py '${{ runner.temp }}/paddock-demo'
        working-directory: extensions/paddock_lab
